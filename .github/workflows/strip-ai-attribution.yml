name: Strip AI attribution from comments

# Individual sessions repeatedly forgetting to sweep for self-attribution
# footers before posting was a recurring problem (CLAUDE.md documents the
# manual sweep; this workflow is the automated backstop that doesn't depend
# on any single session remembering it). Runs on every new or edited issue,
# PR, issue comment, and PR review comment; strips the exact known footer
# patterns if present and updates the body/comment in place -- never touches
# anything else in the text.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip-attribution:
    runs-on: ubuntu-latest
    # Never re-trigger on the bot's own edit -- avoids an infinite loop of
    # edit events. github-actions[bot] is the identity PATCH requests run
    # under with the default GITHUB_TOKEN.
    if: >
      (github.event.comment == null || github.event.comment.user.login != 'github-actions[bot]') &&
      (github.event.issue == null || github.event.issue.user.login != 'github-actions[bot]') &&
      (github.event.pull_request == null || github.event.pull_request.user.login != 'github-actions[bot]')
    steps:
      - name: Strip known AI self-attribution footers
        uses: actions/github-script@v7
        with:
          script: |
            // Same patterns as Tests/NoAIAttribution.Tests.ps1 -- keep both
            // in sync if either changes.
            const patterns = [
              /\r?\n\r?\n---\r?\n_Generated by \[Claude Code\]\(https:\/\/claude\.ai\/code\)_\s*$/,
              /\r?\n\r?\nGenerated by Claude Code\s*$/,
              /\r?\nCo-Authored-By:\s*Claude[^\n]*\s*$/gm
            ];

            function strip(body) {
              if (!body) return body;
              let stripped = body;
              for (const pattern of patterns) {
                stripped = stripped.replace(pattern, '');
              }
              return stripped;
            }

            const comment = context.payload.comment;
            if (comment) {
              const stripped = strip(comment.body);
              if (stripped === comment.body) {
                console.log('No AI attribution pattern found in comment -- nothing to do.');
              } else {
                const isPrComment = context.eventName === 'pull_request_review_comment';
                console.log(`Stripping AI attribution from comment ${comment.id} (PR review comment: ${isPrComment})`);
                if (isPrComment) {
                  await github.rest.pulls.updateReviewComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id,
                    body: stripped
                  });
                } else {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id,
                    body: stripped
                  });
                }
              }
              return;
            }

            const issue = context.payload.issue;
            if (issue) {
              const stripped = strip(issue.body);
              if (stripped === issue.body) {
                console.log('No AI attribution pattern found in issue body -- nothing to do.');
              } else {
                console.log(`Stripping AI attribution from issue #${issue.number} body`);
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: stripped
                });
              }
              return;
            }

            const pr = context.payload.pull_request;
            if (pr) {
              const stripped = strip(pr.body);
              if (stripped === pr.body) {
                console.log('No AI attribution pattern found in PR body -- nothing to do.');
              } else {
                console.log(`Stripping AI attribution from PR #${pr.number} body`);
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  body: stripped
                });
              }
            }
