name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, review/rc8-package-runtime-ux-fixes, fix/rc8-release-blockers ]

jobs:
  quality-gates:
    name: Quality gates
    runs-on: windows-latest

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        shell: powershell
        run: |
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "CI checked out source $actual, expected exact source $expected."
          }
          Write-Host "Exact source checkout verified: $actual"

      - name: ASCII purity check
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\TeknoParrot-Manager.ps1")
          $count = ($bytes | Where-Object { $_ -gt 127 }).Count
          if ($count -gt 0) {
            Write-Error "ASCII check FAILED: $count non-ASCII byte(s) found. PS 5.1 reads BOM-less UTF-8 as Windows-1252; non-ASCII bytes cause parse errors."
            exit 1
          }
          Write-Host "ASCII check passed: 0 non-ASCII bytes."

      - name: Parse check
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\TeknoParrot-Manager.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            Write-Error "Parse check FAILED: $($errs.Count) parse error(s)."
            exit 1
          }
          Write-Host "Parse check passed: 0 errors."

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 1.21

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          $findings = Invoke-ScriptAnalyzer -Path "$PWD\TeknoParrot-Manager.ps1" `
                        -Severity Error,Warning `
                        -Settings "$PWD\PSScriptAnalyzerSettings.psd1"
          if ($findings.Count -gt 0) {
            $findings | ForEach-Object {
              Write-Host "[$($_.Severity)] $($_.RuleName) (line $($_.Line)): $($_.Message)"
            }
            Write-Error "PSScriptAnalyzer FAILED: $($findings.Count) finding(s). See PSScriptAnalyzerSettings.psd1 for approved exclusions."
            exit 1
          }
          Write-Host "PSScriptAnalyzer passed: 0 findings."

      - name: GameSupport schema JSON validation
        shell: powershell
        run: |
          $schemaRelativePaths = @(
            'contracts\_schema\GameSupportAssessmentV1.schema.json',
            'contracts\_schema\GameSupportAssessmentV1.1.schema.json',
            'contracts\_schema\GameSupportContractV1.1.schema.json',
            'contracts\_schema\GameSupportContractV1.2.schema.json',
            'contracts\_schema\GameSupportContractV1.3.schema.json',
            'contracts\_schema\GameSupportContractV1.schema.json',
            'contracts\_schema\GameSupportContractRegistryV1.1.schema.json',
            'contracts\_schema\GameSupportContractRegistryV1.2.schema.json',
            'contracts\_schema\GameSupportContractRegistryV1.3.schema.json',
            'contracts\_schema\GameSupportContractRegistryV1.schema.json',
            'contracts\_schema\TpmReleaseCatalogSnapshotV1.schema.json',
            'contracts\_schema\TpmReleaseCatalogDeltaV1.schema.json'
          )
          foreach ($relativePath in $schemaRelativePaths) {
            $schemaPath = Join-Path $env:GITHUB_WORKSPACE $relativePath
            if (-not (Test-Path -LiteralPath $schemaPath -PathType Leaf)) {
              throw "Schema file is missing: $relativePath"
            }
            Get-Content -LiteralPath $schemaPath -Raw | ConvertFrom-Json -ErrorAction Stop | Out-Null
          }
          Write-Host "GameSupport schema JSON validation passed: $($schemaRelativePaths.Count) files."

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.7.1

      - name: Install InjectionHunter
        shell: powershell
        run: |
          Install-Module InjectionHunter -Scope CurrentUser -Force -RequiredVersion 1.0.0
          Import-Module InjectionHunter -RequiredVersion 1.0.0 -ErrorAction Stop
          $module = Get-Module InjectionHunter | Select-Object -First 1
          if ($null -eq $module -or [string]$module.Version -ne '1.0.0') { throw 'InjectionHunter 1.0.0 was not imported.' }
      - name: Pester regression suites
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            "$PWD\Tests\TeknoParrot-Manager.Tests.ps1",
            "$PWD\Tests\QualitySystem.Tests.ps1",
            "$PWD\Tests\TPMGameSupport.Contracts.Tests.ps1",
            "$PWD\Tests\TPMGameSupport.Assessments.Tests.ps1",
            "$PWD\Tests\SupportPostureCorpus.Tests.ps1",
            "$PWD\Tests\SupportPackage.Tests.ps1",
            "$PWD\Tests\TpmReleaseCatalogSnapshot.Tests.ps1",
            "$PWD\Tests\TpmCatalogSnapshotTools.Tests.ps1",
            "$PWD\Tests\TPMCertification.Authority.Tests.ps1",
            "$PWD\Tests\TPMCertification.Contracts.Tests.ps1",
            "$PWD\Tests\TPMCertification.ContractRegistry.Tests.ps1",
            "$PWD\Tests\TPMCertification.ProductionFacts.Tests.ps1",
            "$PWD\Tests\TPMCertification.ProductionHarnessComposition.Tests.ps1",
            "$PWD\Tests\TPMReleasePackage.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchPluginLane.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchSb3Lane.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchNativeMainComponentRestorations.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchSb3FmodLane.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchInfinityBladeFxLane.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchMainExtras.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchCrossRaidComposition.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchCrossRaidBaseLane.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchTmntNativeMainComponents.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchKofMainComponents.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchMkdxUsa106MainComponent.Tests.ps1",
            "$PWD\Tests\TpmRequiredPatchGashaaaan2MainDependencies.Tests.ps1"
          )
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "$PWD\pester-results.xml"
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: pester-results.xml
