name: Catalog drift

# Weekly (and on manual start): compares the official TeknoParrot profiles with the decisions file and the pinned catalog snapshot.
# A new profile that fits a family default needs nothing. A new profile that fits none opens, or updates, the one open "catalog-drift" issue.
# Repo tool only: nothing here is shipped to players and nothing in the repository is changed.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      regenerate_docs:
        description: 'Also regenerate docs/GAME-SUPPORT.md from the current profiles and the Eggman guide (attached as a download, not committed)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Check the official TeknoParrot profiles
    runs-on: windows-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clone the official TeknoParrotUI repository
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/teknogods/TeknoParrotUI.git "$env:RUNNER_TEMP\TeknoParrotUI"
          if ($LASTEXITCODE -ne 0) { throw 'The official TeknoParrotUI repository could not be cloned.' }

      - name: Fetch the Eggman guide (manual start with regenerate_docs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_docs }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://eggmansworld.github.io/TeknoParrot/' -OutFile "$env:RUNNER_TEMP\guide.html" -UseBasicParsing

      - name: Compare with the decisions file and the pinned snapshot
        id: drift
        shell: pwsh
        run: |
          $clone = Join-Path $env:RUNNER_TEMP 'TeknoParrotUI'
          $commit = (git -C $clone rev-parse --short HEAD).Trim()
          $arguments = @{
            ProfilesPath       = $clone
            ReportPath         = (Join-Path $env:RUNNER_TEMP 'drift-report.md')
            TeknoParrotVersion = "official repository commit $commit"
          }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.regenerate_docs }}' -eq 'true') {
            $arguments.GuidePath = Join-Path $env:RUNNER_TEMP 'guide.html'
            $arguments.MarkdownPath = Join-Path $env:RUNNER_TEMP 'GAME-SUPPORT.md'
          }
          & .\scripts\Test-TpmCatalogDrift.ps1 @arguments
          $code = $LASTEXITCODE
          "needs_decision=$(if ($code -eq 0) { 'false' } else { 'true' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content -LiteralPath $arguments.ReportPath -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          # Exit 1 only means "a person must decide"; the next step reports it. Any other code is a real failure.
          if ($code -gt 1) { throw "The drift tool failed with exit code $code." }
          exit 0

      - name: Open or update the one catalog-drift issue
        if: ${{ steps.drift.outputs.needs_decision == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = Join-Path $env:RUNNER_TEMP 'drift-report.md'
          $title = 'TeknoParrot catalog drift: new games need a decision'
          gh label create catalog-drift --description 'New TeknoParrot profiles that need a decision' --color FBCA04 --force
          $existing = (gh issue list --label catalog-drift --state open --json number --jq '.[0].number')
          if ($existing) {
            gh issue edit $existing --title $title --body-file $body
          } else {
            gh issue create --title $title --label catalog-drift --body-file $body
          }
          if ($LASTEXITCODE -ne 0) { throw 'The issue could not be opened or updated.' }

      - name: Attach the regenerated game support page
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_docs }}
        uses: actions/upload-artifact@v4
        with:
          name: GAME-SUPPORT
          path: ${{ runner.temp }}/GAME-SUPPORT.md
